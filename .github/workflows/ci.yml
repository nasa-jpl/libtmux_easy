name: CI

on:
  push:
    branches: ["**"]   # tags run release.yml, which calls this
  pull_request:
  workflow_call:   # release.yml runs this first

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.10", "3.12", "3.13"]
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: astral-sh/setup-uv@v6
      # --locked: fail if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync python -m pytest -q

  dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Check the metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python python3-all \
                                  python3-setuptools pybuild-plugin-pyproject
      - run: dpkg-buildpackage -us -uc -b
      - run: mkdir deb && mv ../*.deb deb/
      - name: Install and smoke-test
        run: |
          sudo apt-get install -y ./deb/*.deb
          cd /tmp
          /usr/bin/python3 -c "import libtmux_easy.tmux_lib"
          lte-run true
          rc=0; lte-run sh -c 'exit 3' || rc=$?; test "$rc" = 3
          test ! -e /usr/bin/lte-dash
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: deb/
