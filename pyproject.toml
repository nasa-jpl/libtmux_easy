[project]
name = "libtmux-easy"
version = "0.1.0"
description = "Wrapper around libtmux to make generating a tmux session easier"
readme = "README.md"
authors = [
    { name = "Spencer Diehl", email = "spencer.diehl@jpl.nasa.gov" }
]
requires-python = ">=3.8"
dependencies = [
    "libtmux"
]

# [project.scripts]
# libtmux-wrapper = "libtmux_wrapper:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

