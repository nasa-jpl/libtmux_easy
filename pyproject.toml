[project]
name = "libtmux-easy"
version = "0.2.0"
description = "tmux sessions from Python: exact pane exit status, a live dashboard, pytest fixtures"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    { name = "Spencer Diehl", email = "docdiehl@gmail.com" }
]
keywords = ["tmux", "terminal", "multiplexer", "session", "dashboard", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
]
requires-python = ">=3.8.1"
dependencies = [
    "libtmux>=0.17",
    "psutil",
    "packaging",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
# lte-dash, the dashboard sidebar. Ubuntu's python3-textual is too old, so the
# libtmux-easy-dash .deb bundles this from uv.lock (debian/dash-requirements.txt).
dash = [
    "textual>=1.0",
]

# 'uv sync' installs this group by default: a development environment with
# the dashboard and the tests. Not part of the package (pip, the .deb).
[dependency-groups]
dev = ["libtmux-easy[dash,test]"]

[project.scripts]
lte-run = "libtmux_easy.wrap:main"
lte-dash = "libtmux_easy.dash.cli:main"
lte-session = "libtmux_easy.launch:main"
lte-key = "libtmux_easy.dash.keys:main"
lte-close = "libtmux_easy.close:main"
lte-defaults = "libtmux_easy.starter:main"

# setuptools rather than a newer backend: it is packaged for Ubuntu 24.04, so
# the .deb (debian/) builds from this same file with apt-only dependencies.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libtmux_easy = ["lte_rc.bash"]

[project.urls]
"Homepage" = "https://github.com/nasa-jpl/libtmux_easy"
"Bug Tracker" = "https://github.com/nasa-jpl/libtmux_easy/issues"
"Repository" = "https://github.com/nasa-jpl/libtmux_easy"