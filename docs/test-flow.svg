<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" role="img" aria-label="A test class's flow: a failure skips ahead to teardown_class; processes stay up until then" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8f98"/>
    </marker>
  </defs>
  <rect width="760" height="304" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">A failure skips ahead to teardown_class; processes stay up until then</text>

  <g fill="none" stroke="#8a8f98" stroke-width="1.25">
    <path d="M180 120H210" marker-end="url(#arrow)"/>
    <path d="M370 120H400" marker-end="url(#arrow)"/>
    <path d="M560 120H596" marker-end="url(#arrow)"/>
    <path d="M660 80V64H290V92" marker-end="url(#arrow)"/>
    <path d="M660 160V222" marker-end="url(#arrow)"/>
    <path d="M290 148V222" marker-end="url(#arrow)"/>
    <path d="M590 250H370" marker-end="url(#arrow)"/>
    <path d="M210 250H180" marker-end="url(#arrow)"/>
  </g>

  <g text-anchor="middle">
    <rect x="20" y="92" width="160" height="56" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
    <text x="100" y="116" font-weight="600" fill="#1f2328">setup_class</text>
    <text x="100" y="134" font-size="11.5" fill="#57606a">starts processes</text>

    <rect x="210" y="92" width="160" height="56" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
    <text x="290" y="116" font-weight="600" fill="#1f2328">check()</text>
    <text x="290" y="134" font-size="11.5" fill="#57606a">health, before each test</text>

    <rect x="400" y="92" width="160" height="56" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
    <text x="480" y="116" font-weight="600" fill="#1f2328">the test runs</text>
    <text x="480" y="134" font-size="11.5" fill="#57606a">checked again after</text>

    <polygon points="596,120 660,80 724,120 660,160" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
    <text x="660" y="124" fill="#1f2328">Outcome?</text>

    <rect x="590" y="222" width="140" height="56" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
    <text x="660" y="246" font-weight="600" fill="#1f2328">skip the rest</text>
    <text x="660" y="264" font-size="11.5" fill="#57606a">of the class</text>

    <rect x="210" y="222" width="160" height="56" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"/>
    <text x="290" y="246" font-weight="600" fill="#1f2328">teardown_class</text>
    <text x="290" y="264" font-size="11.5" fill="#1f2328">optional; processes still up</text>

    <rect x="20" y="222" width="160" height="56" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
    <text x="100" y="246" font-weight="600" fill="#1f2328">plugin stops the rest</text>
    <text x="100" y="264" font-size="11.5" fill="#57606a">checked if all passed</text>

    <text x="475" y="56" font-size="11.5" fill="#57606a">passed: next test</text>
  </g>
  <text x="650" y="196" text-anchor="end" font-size="11.5" fill="#57606a">failed: a death or an assert</text>
  <text x="300" y="190" font-size="11.5" fill="#57606a">no tests left</text>
</svg>
